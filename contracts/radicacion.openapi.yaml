openapi: 3.1.0
info:
  title: API de Radicación PQRSF — DocxFlow
  version: 0.2.0
  description: |
    Contrato que RadicadosPQRSF necesita del Sistema de Gestión Documental.

    ## Estado real de DocxFlow (verificado 2026-10-26)

    `https://docxflow.camarapereira.org.co` es una aplicación **PHP/Symfony**
    con sesión por cookie (`PHPSESSID`). Expone un prefijo `/api` que responde
    JSON (`{"error":{"code":404,"message":"Not Found"}}`), pero **no publica
    documentación**: `/api/docs`, `/api/docs.json`, `/swagger` y
    `/openapi.json` devuelven 404.

    Conclusión: **no se puede integrar por API sin el proveedor.** Hay que
    pedirle a DocxFlow (o al área de sistemas de la Cámara) una de estas tres
    cosas, en orden de preferencia:

    1. Documentación del API interna + credenciales (token o usuario técnico).
    2. Un endpoint de radicación para integraciones.
    3. Confirmación de que no existe, y entonces evaluar automatización de
       navegador (RPA) como plan B.

    Este documento describe lo que el cliente espera: es la lista de preguntas
    que hay que llevarle al proveedor.

    ## Numeración

    DocxFlow **genera** el radicado; nosotros solo lo recibimos y validamos.
    Formato: `CCPE<AA>-<NNNN>` donde `AA` son los dos últimos dígitos del año.

    - 2026 -> `CCPE26-0001`
    - 2027 -> `CCPE27-0001`

    El consecutivo reinicia cada año. No se debe construir el número en el
    cliente: es responsabilidad del SGD.

servers:
  - url: http://localhost:8080
    description: Mock local (desarrollo) — nunca crea radicados reales
  - url: https://docxflow.camarapereira.org.co/api
    description: DocxFlow real (pendiente de documentación del proveedor)

paths:
  /areas:
    get:
      operationId: listAreas
      summary: Catálogo de áreas
      responses:
        '200':
          description: Catálogo de áreas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'

  /usuarios:
    get:
      operationId: listUsuarios
      summary: Catálogo de usuarios que pueden recibir un radicado
      description: |
        Necesario para resolver el "destinatario": el usuario que dará
        respuesta. Sin este catálogo la asignación no puede automatizarse.
      parameters:
        - name: area
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Usuarios, opcionalmente filtrados por área
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'

  /tramites:
    get:
      operationId: listTramites
      summary: Catálogo de tipos de trámite de DocxFlow
      description: |
        **Bloqueante.** Nuestra clasificación produce 5 tipos PQRSF
        (petición, queja, reclamo, sugerencia, felicitación), pero DocxFlow
        radica por "tipo de trámite", que es un catálogo distinto y propio de
        la entidad. Sin este catálogo no se puede mapear uno a otro.
      responses:
        '200':
          description: Tipos de trámite disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoTramite'

  /radicados:
    post:
      operationId: crearRadicado
      summary: Crear un radicado a partir de un correo
      description: |
        Debe ser **idempotente**. Si llega un `idempotency_key` ya radicado,
        el SGD responde 200 con el radicado existente en lugar de crear otro.
        Es la única defensa que sobrevive si se pierde el estado local.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Message-ID del correo. Identifica unívocamente el origen.
          schema:
            type: string
            example: <CABc123@mail.gmail.com>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadicadoRequest'
      responses:
        '201':
          description: Radicado creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Radicado'
        '200':
          description: Ya existía para ese Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Radicado'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SGD no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /radicados/{numero}:
    get:
      operationId: consultarRadicado
      summary: Consultar un radicado por su número
      parameters:
        - name: numero
          in: path
          required: true
          schema:
            type: string
            pattern: '^CCPE\d{2}-\d{4}$'
          example: CCPE26-0001
      responses:
        '200':
          description: Radicado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Radicado'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Area:
      type: object
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          example: atencion_usuario
        nombre:
          type: string
          example: Atención al Usuario

    Usuario:
      type: object
      required: [email, nombre]
      properties:
        email:
          type: string
          format: email
          example: jvergara@camarapereira.org.co
        nombre:
          type: string
        area:
          type: string
          description: Código del área a la que pertenece

    TipoTramite:
      type: object
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          example: PQRSF-QUEJA
        nombre:
          type: string
          example: Queja

    RadicadoRequest:
      type: object
      required:
        - tipo_tramite
        - asunto
        - remitente
        - destinatario
        - cuerpo
        - cantidad_documentos
      properties:
        tipo_tramite:
          type: string
          description: Código del catálogo de trámites de DocxFlow
        tipo_pqrsf:
          type: string
          description: Nuestra clasificación, para trazabilidad
          enum: [peticion, queja, reclamo, sugerencia, felicitacion]
        asunto:
          type: string
          maxLength: 500
        remitente:
          $ref: '#/components/schemas/Persona'
        destinatario:
          type: object
          description: |
            Usuario que dará respuesta. DocxFlow distribuye el radicado a este
            usuario, no solo al área.
          required: [email]
          properties:
            email:
              type: string
              format: email
            nombre:
              type: string
            area:
              type: string
        cuerpo:
          type: string
          description: Texto plano del correo, sin HTML
        recibido_en:
          type: string
          format: date-time
        cantidad_documentos:
          type: integer
          minimum: 0
          description: Debe coincidir con el número de adjuntos enviados
        confianza:
          type: number
          minimum: 0
          maximum: 1
          description: Confianza del clasificador, para auditoría
        adjuntos:
          type: array
          items:
            $ref: '#/components/schemas/Adjunto'

    Persona:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string

    Adjunto:
      type: object
      required: [nombre, clasificacion]
      properties:
        nombre:
          type: string
          example: cedula.pdf
        tipo_mime:
          type: string
          example: application/pdf
        tamano_bytes:
          type: integer
        clasificacion:
          type: string
          description: |
            Tipo de documento según el catálogo de DocxFlow
            (cédula, cámara de comercio, poder, otro...).
            DocxFlow exige clasificar cada anexo.
          example: cedula
        contenido_base64:
          type: string

    Radicado:
      type: object
      required: [numero, estado, creado_en]
      properties:
        numero:
          type: string
          pattern: '^CCPE\d{2}-\d{4}$'
          example: CCPE26-0001
        estado:
          type: string
          enum: [radicado, distribuido, cerrado]
        tipo_tramite:
          type: string
        destinatario:
          type: string
          description: Email del usuario que dará respuesta
        creado_en:
          type: string
          format: date-time
        idempotency_key:
          type: string

    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          example: TIPO_TRAMITE_INEXISTENTE
        mensaje:
          type: string
        detalle:
          type: string
