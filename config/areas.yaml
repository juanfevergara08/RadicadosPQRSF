# ============================================================
# Catálogo de tipos y áreas para clasificación por reglas.
#
# ESTE ARCHIVO LO AJUSTA EL NEGOCIO, no el programador.
# Mientras más palabras reales del día a día tenga, menos
# correos caerán en revisión humana.
#
# - 3 o más coincidencias -> confianza alta, se radica solo
# - 1 o 2 coincidencias   -> confianza media, según umbral
# - 0 coincidencias       -> va a revisión
# ============================================================

tipos:
  peticion:
    descripcion: Solicitud de información, documentos o servicios
    palabras:
      - solicitud
      - solicito
      - requiero
      - necesito
      - pido
      - favor enviar
      - favor remitir
      - copia de
      - certificado
      - constancia
      - informacion
      - informacion sobre
      - estado de mi
      - tramite

  queja:
    descripcion: Manifestación de inconformidad por la atención recibida
    palabras:
      - queja
      - inconformidad
      - inconforme
      - mala atencion
      - maltrato
      - no me atendieron
      - me trataron mal
      - pesimo servicio
      - deficiente atencion
      - demora en la atencion

  reclamo:
    descripcion: Exigencia sobre un servicio o cobro incorrecto
    palabras:
      - reclamo
      - cobro
      - cobro indebido
      - doble cobro
      - factura
      - facturacion
      - error en el cobro
      - me cobraron
      - devolucion
      - reembolso
      - no estoy de acuerdo con
      - incumplimiento

  sugerencia:
    descripcion: Propuesta de mejora
    palabras:
      - sugerencia
      - sugiero
      - propongo
      - recomendacion
      - mejora
      - idea
      - seria bueno
      - podrian

  felicitacion:
    descripcion: Reconocimiento al servicio
    palabras:
      - felicitacion
      - felicito
      - felicitar
      - agradezco
      - agradecimiento
      - excelente atencion
      - muy amables
      - gracias por

areas:
  atencion_usuario:
    nombre: Atencion al Usuario
    palabras:
      - atencion
      - servicio al cliente
      - asesor
      - funcionario
      - taquilla
      - informacion general
      - pqrsf

  financiera:
    nombre: Financiera y Cartera
    palabras:
      - factura
      - cobro
      - pago
      - cartera
      - devolucion
      - reembolso
      - cuenta de cobro
      - valor

  tecnica:
    nombre: Tecnica y Operaciones
    palabras:
      - tecnico
      - falla
      - dano
      - mantenimiento
      - reparacion
      - instalacion
      - servicio tecnico
      - producto defectuoso

  juridica:
    nombre: Juridica
    palabras:
      - abogado
      - tutela
      - demanda
      - legal
      - derecho de peticion
      - accion popular
      - notificacion judicial

  talento_humano:
    nombre: Talento Humano
    palabras:
      - empleado
      - contratacion
      - nomina
      - personal
      - trabajador

# Área que recibe lo que no se puede clasificar con seguridad
area_por_defecto: atencion_usuario

# ============================================================
# MAPEO HACIA DOCXFLOW — catálogo REAL (verificado 2026-10-27)
# ============================================================
# DocxFlow radica por "tipo de trámite" y usa un id numérico.
# Estos ids salen del <select id="ventanilla_radicacion_tramite"> real.
#
# OJO: el usuario mencionó "Solicitud de Información", pero ese trámite
# NO existe en el catálogo. El equivalente para peticiones es
# 27 = PQRSF-Peticiones (o 25 = Derechos de peticion, distinto trámite).
# Confirmar con la Cámara cuál corresponde antes de producción.

tramites:
  peticion: "27"       # PQRSF-Peticiones
  queja: "28"          # PQRSF-Queja
  reclamo: "29"        # PQRSF-Reclamo
  sugerencia: "30"     # PQRSF-Sugerencias
  felicitacion: "31"   # PQRSF-Felicitaciones

# Otros trámites del catálogo, por si el negocio los necesita:
#   1  Correspondencia            37  Visita domiciliaria
#   25 Derechos de peticion       38  FACTURAS JSP7
#   39 Facturas Gestion Humana    40  CONTRATOS JPS7
#   41 CONCILIACION BANCARIA      42  DocumentosSinRadicado
#   45 NUEVA AFILIACIÓN           46  CREDITOS TESORERIA
#   47 CajaMenor Jsp7

# Usuario que da respuesta a cada área.
# En DocxFlow el destinatario es un FUNCIONARIO que se elige por
# autocompletado (POST /funcionario/autocomplete/1). No es un correo.
# PENDIENTE: completar con el funcionario real por área.
destinatarios:
  atencion_usuario: JUAN FELIPE VERGARA OSORIO
  financiera: JUAN FELIPE VERGARA OSORIO
  tecnica: JUAN FELIPE VERGARA OSORIO
  juridica: JUAN FELIPE VERGARA OSORIO
  talento_humano: JUAN FELIPE VERGARA OSORIO

# Unidades de distribución reales (valor -> nombre).
# PENDIENTE: decidir a qué unidad va cada área.
unidades_distribucion:
  "1": 01 - UD PRESIDENCIA EJECUTIVA
  "2": 02 - UD DIRECCIÓN DE CONTROL INTERNO
  "3": 03 - UD DIRECCIÓN DE GESTIÓN HUMANA
  "4": 04 - UD SECRETARÍA GENERAL
  "5": 05 - UD DIRECCIÓN DE CENTRO DE ARBITRAJE Y CONCILIACIÓN
  "6": 06 - UD DIRECCIÓN JURIDICA DE REGISTROS
  "7": 07 - UD GERENCIA DEL CENTRO DE CONVENCIONES EXPOFUTURO
  "8": 08 - UD CENTRO DE ATENCIÓN EMPRESARIAL CAE
  "9": 09 - UD JEFATURA DE CONTABILIDAD
  "10": 10 - UD DIRECCIÓN DE DESARROLLO REGIONAL
  "12": 11 - UD GERENCIA AGENCIA DE PROMOCIÓN DE PEREIRA Y RISARALDA
  "13": 12 - UD DIRECCIÓN ADMINISTRATIVA
  "17": 13 - UD COORDINACIÓN DE PROYECTOS E INNOVACIÓN
  "18": 14 - UD DIRECCION DE REGISTROS PUBLICOS
  "15": 15 - UD JEFATURA DE SISTEMAS
  "19": 15 - UD JSP7
  "20": 16 - UD AFILIADOS

# Clasificación que se asigna a cada anexo al radicar.
# ESTADO: confirmado que por ahora todo se clasifica como "anexo".
# PENDIENTE: catálogo real de tipos documentales de DocxFlow.
clasificacion_anexo_por_defecto: anexo

# ============================================================
# CORREOS QUE NO SON PQRSF
# ============================================================
# Notificaciones automáticas del sistema, rebotes y boletines NO deben
# radicarse aunque contengan palabras como "solicitud". Sin este filtro, el
# clasificador las marca como petición con alta confianza y genera radicados
# basura en DocxFlow.
#
# Se comparan en minúsculas y sin tildes contra remitente y asunto.

excluir:
  remitentes:
    - sistemas@camarapereira.org.co
    - noreply@
    - no-responder@
    - notificaciones@
    - mailer-daemon@
    - postmaster@
  asuntos:
    - Notificacion - Soportes transaccion
    - Reporte SMS
    - Soportes transaccion realizada


